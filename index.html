<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desi AI — अपना जार्विस</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:system-ui; background:#0b0b12; color:#fff; height:100vh; display:flex; flex-direction:column; }
  header { padding:16px; text-align:center; background:#15151f; border-bottom:1px solid #222; }
  header h1 { font-size:18px; background:linear-gradient(90deg,#00d4ff,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:80%; padding:12px 16px; border-radius:16px; line-height:1.5; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#2563eb; }
  .bot { align-self:flex-start; background:#1e1e2e; border:1px solid #2a2a3a; }
  #bar { padding:12px; background:#15151f; border-top:1px solid #222; display:flex; gap:8px; align-items:center; }
  #msg { flex:1; padding:12px; border-radius:12px; border:1px solid #333; background:#0b0b12; color:#fff; font-size:15px; }
  button { padding:12px 16px; border:none; border-radius:12px; background:linear-gradient(135deg,#00d4ff,#a855f7); color:#fff; font-weight:600; cursor:pointer; font-size:15px; }
  button:disabled { opacity:0.5; }
  #mic.rec { background:#ef4444; }
  #preview { padding:0 16px; }
  #preview img { max-height:80px; border-radius:8px; margin-top:8px; }
</style>
</head>
<body>
<header><h1>🤖 DESI AI — अपना जार्विस</h1></header>
<div id="chat">
  <div class="msg bot">नमस्ते बॉस! मैं तुम्हारा Desi AI हूँ। हिंदी में बात करो, फोटो भेजो, या आवाज़ में बोलो। 🚀</div>
</div>
<div id="preview"></div>
<div id="bar">
  <input type="file" id="file" accept="image/*" hidden>
  <button onclick="document.getElementById('file').click()">📷</button>
  <button id="mic" onclick="toggleMic()">🎤</button>
  <input id="msg" placeholder="कुछ लिखो..." onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()">भेजो</button>
</div>

<script>
const chat = document.getElementById('chat');
const msgInput = document.getElementById('msg');
let selectedFile = null;

document.getElementById('file').onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const scale = Math.min(1024 / img.width, 1024 / img.height, 1);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((blob) => {
        selectedFile = new File([blob], "photo.jpg", { type: "image/jpeg" });
        document.getElementById('preview').innerHTML = `<img src="${URL.createObjectURL(blob)}">`;
      }, 'image/jpeg', 0.8);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(f);
};

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function send() {
  const text = msgInput.value.trim();
  if (!text && !selectedFile) return;
  addMsg(text || "📷 फोटो", 'user');
  msgInput.value = '';

  if (selectedFile) {
    const fd = new FormData();
    fd.append("message", text || "इस फोटो में क्या है?");
    fd.append("image", selectedFile);
    selectedFile = null;
    document.getElementById('preview').innerHTML = '';
    try {
      const r = await fetch('/chat-image', { method:'POST', body: fd });
      const j = await r.json();
      addMsg(j.reply || j.error, 'bot');
    } catch(e) { addMsg("Error: " + e.message, 'bot'); }
    return;
  }

  const bubble = addMsg("", 'bot');
  try {
    const r = await fetch('/chat', {
      method:'POST',
      body: new URLSearchParams({ message: text })
    });
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let full = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      full += decoder.decode(value, { stream: true });
      bubble.textContent = full;
      chat.scrollTop = chat.scrollHeight;
    }
  } catch(e) { bubble.textContent = "Error: " + e.message; }
}

let recognizing = false, recog = null;
function toggleMic() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    alert("तुम्हारा browser आवाज़ support नहीं करता"); return;
  }
  if (recognizing) { recog.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recog = new SR();
  recog.lang = 'hi-IN';
  recog.interimResults = false;
  recog.onstart = () => { recognizing = true; document.getElementById('mic').classList.add('rec'); };
  recog.onend = () => { recognizing = false; document.getElementById('mic').classList.remove('rec'); };
  recog.onresult = (e) => {
    msgInput.value = e.results[0][0].transcript;
    send();
  };
  recog.start();
}
</script>
</body>
</html>
